apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: global-apps
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: "https://github.com/kikan321/hello-openshift-gitops.git"
              revision: "master"
              directories:
                - path: "dev/*"
          - clusters:
              selector:
                matchLabels:
                  environment: dev
  template:
    metadata:
      name: "{{path.basename}}-{{name}}"
    spec:
      project: "default"
      destination:
        namespace: "{{name}}"
        server: "{{server}}"
      source:
        repoURL: "https://github.com/kikan321/hello-openshift-gitops.git"
        path: "{{path}}"
        helm:
          valueFiles:
            - "values-dev.yaml"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - "CreateNamespace=true"
