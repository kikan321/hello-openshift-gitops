apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: global-apps
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          # Generador 1: Lee todas las aplicaciones desde Git
          - git:
              repoURL: https://github.com/kikan321/hello-openshift-gitops.git
              revision: master
              directories:
                - path: dev/*
          # Generador 2: Lee todos los clusters seleccionados por RHACM
          - clusterDecisionResource:
              configMapRef: dev-placement-all
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: dev-placement-all
              requeueAfterSeconds: 30
  template:
    metadata:
      name: '{{path.basename}}-{{name}}'
    spec:
      project: default
      destination:
        namespace: '{{name}}'
        server: '{{server}}'
      source:
        repoURL: https://github.com/kikan321/hello-openshift-gitops.git
        path: '{{path}}'
        helm:
          valueFiles:
            - values-dev.yaml
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
